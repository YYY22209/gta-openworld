# ============================================================
# deploy.yml — 街巷行者 · GitHub Pages 全自动部署
#
# 触发方式：
#   1. git push 到 main（或 master）分支 → 自动构建并发布网站；
#   2. 仓库 Actions 页面手动点击 "Run workflow"。
#
# 特点（无需任何手动后台设置）：
#   · configure-pages 的 enablement: true 会通过 GitHub API
#     自动开启仓库的 Pages 功能并设为 "GitHub Actions" 来源；
#   · 只发布游戏静态文件（index.html / css / js / assets），
#     Electron、Node 配置等桌面版内容不会出现在网站上；
#   · 部署完成后网站链接会显示在 Actions 运行摘要里。
#
# 部署地址：https://<你的用户名>.github.io/<仓库名>/
# ============================================================

name: 部署网站到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，后推送的覆盖先推送的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages（自动开启，免手动设置）
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 组装站点（仅游戏静态文件）
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets _site/
          touch _site/.nojekyll

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
